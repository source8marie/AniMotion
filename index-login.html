<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - T&T's AniMotion</title>
    <link rel="icon" href="img/T&T_Flav.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <style>
        :root {
            --primary-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --text-light: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: url('img/animotionbg.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
            transition: backdrop-filter 0.6s ease; /* Smooth blur transition */
        }

        /* Ambient Glow Particles */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* State when wallpaper is being viewed */
        body.view-mode {
            backdrop-filter: blur(0px) !important;
            -webkit-backdrop-filter: blur(0px) !important;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 20.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: translateY(0);
        }

        .login-container.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        /* Bottom Left View Button */
        .view-wallpaper-btn {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            z-index: 100;
            background: none;
            border: none;
            color: var(--text-light);
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: none;
        }

        .view-wallpaper-btn:hover {
            color: var(--text-light);
            transform: scale(1.1);
            background: none;
        }

        .logo-section {
            margin-bottom: 2.2rem;
        }

        .logo-section img {
            width: 13.5rem;
            height: auto;
            margin-bottom: 0.6rem;
            filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.4));
        }

        .logo-section h1 {
            font-size: 1.55rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .logo-section p {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .btn-login, .btn-guest {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
        }

        .btn-login {
            background: var(--primary-purple);
            color: var(--text-light);
        }

        .btn-login:hover {
            background: var(--accent-pink);
            transform: translateY(-2px);
        }

        .btn-guest {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
        }

        .btn-guest:hover {
            background: rgba(139, 92, 246, 0.12);
            border-color: var(--primary-purple);
        }

        .signup-link {
            margin-top: 1.8rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .signup-link a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 800;
        }

        @media (max-width: 480px) {
            .view-wallpaper-btn { bottom: 1rem; left: 1rem; width: 3rem; height: 3rem; }
            .login-container { max-width: 88%; padding: 2.2rem 1.5rem; }
        }
    </style>
</head>
<body id="mainBody">

    <button class="view-wallpaper-btn" onclick="toggleView(event)" id="viewBtn" title="Toggle UI">
        <i class="fas fa-eye" id="viewIcon"></i>
    </button>

    <div class="login-container" id="loginCard">
        <div class="logo-section">
            <img src="img/animotionhdr1.png" alt="T&T's AniMotion Logo">
            <h1>Welcome Back</h1>
            <p>Choose how to continue</p>
        </div>

        <div class="button-group">
            <a href="index.html" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </a>
            <a href="index.html" class="btn-guest">
                <i class="fas fa-user-secret"></i> Continue as Guest
            </a>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="account.html">Sign Up</a>
        </div>
    </div>

    <script>
        const card = document.getElementById('loginCard');
        const icon = document.getElementById('viewIcon');

        function toggleView(event) {
            event.stopPropagation();
            const isHidden = card.classList.toggle('hidden');
            
            // Toggle icons between Eye and Eye-Slash
            if (isHidden) {
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
